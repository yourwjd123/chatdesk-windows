name: Windows verification and release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: windows-release
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_NO_CACHE_DIR: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build in non-system workspace
        shell: pwsh
        run: ./windows.ps1 -Mode Build
      - name: Test accounts, novel canon and Qt UI
        shell: pwsh
        run: |
          $runtimePath = Join-Path $env:GITHUB_WORKSPACE 'runtime'
          $env:TEMP = $runtimePath
          $env:TMP = $runtimePath
          $env:XDG_CACHE_HOME = Join-Path $runtimePath 'cache'
          & ./.venv/Scripts/python.exe -B -m unittest discover -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Smoke test packaged novel workspace
        shell: pwsh
        run: |
          $process = Start-Process -FilePath './dist/ChatDesk/ChatDesk.exe' -ArgumentList '--self-test' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Packaged application self-test failed.' }
      - name: Package portable folder
        shell: pwsh
        run: |
          Copy-Item README.md ./dist/ChatDesk/README.zh-CN.md
          Copy-Item VALIDATION.md ./dist/ChatDesk/VALIDATION.md
          Compress-Archive -Path ./dist/ChatDesk/* -DestinationPath ./runtime/Mozhou-0.3.2-Windows-x64.zip -Force
          Get-FileHash ./runtime/Mozhou-0.3.2-Windows-x64.zip -Algorithm SHA256
      - name: Publish verified release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = 'v0.3.2'
          gh release view $version --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $version ./runtime/Mozhou-0.3.2-Windows-x64.zip --repo $env:GITHUB_REPOSITORY --clobber
          } else {
            gh release create $version ./runtime/Mozhou-0.3.2-Windows-x64.zip --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'Mozhou Novel Studio 0.3.2' --notes-file RELEASE_NOTES.md --prerelease
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
